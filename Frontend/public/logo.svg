<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <defs>
    <!-- Shield Gradient -->
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f4c81" />
    </linearGradient>

    <!-- Cross Gradient -->
    <linearGradient id="crossGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="50%" stop-color="#0e7490" />
      <stop offset="100%" stop-color="#0f4c81" />
    </linearGradient>

    <!-- Swoosh / Orbit Gradient -->
    <linearGradient id="orbitGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#083344" />
      <stop offset="35%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>

    <!-- Glowing Node Gradient -->
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>

    <!-- Drop Shadow for 3D effect -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- SHIELD OUTLINE -->
  <path 
    d="M 250,75 C 190,75 130,95 110,125 C 90,205 115,325 250,445 C 385,325 410,205 390,125 C 370,95 310,75 250,75 Z" 
    stroke="url(#shieldGradient)" 
    stroke-width="26" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
    fill="none" 
    filter="url(#dropShadow)"
  />

  <!-- MEDICAL CROSS -->
  <path 
    d="M 222,140 
       H 278 
       A 14,14 0 0 1 292,154 
       V 196 
       H 334 
       A 14,14 0 0 1 348,210 
       V 266 
       A 14,14 0 0 1 334,280 
       H 292 
       V 322 
       A 14,14 0 0 1 278,336 
       H 222 
       A 14,14 0 0 1 208,322 
       V 280 
       H 166 
       A 14,14 0 0 1 152,266 
       V 210 
       A 14,14 0 0 1 166,196 
       H 208 
       V 154 
       A 14,14 0 0 1 222,140 Z" 
    fill="url(#crossGradient)" 
    filter="url(#dropShadow)"
  />

  <!-- CIRCUIT TRACES INSIDE CROSS -->
  <g stroke="url(#glowGradient)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top arm circuit trace -->
    <path d="M 235,160 V 185 H 250" />
    <circle cx="235" cy="160" r="4.5" fill="#38bdf8" stroke="none" />
    
    <path d="M 265,170 V 195" />
    <circle cx="265" cy="170" r="4.5" fill="#38bdf8" stroke="none" />
    <circle cx="265" cy="195" r="4.5" fill="#38bdf8" stroke="none" />

    <!-- Left arm circuit trace -->
    <path d="M 175,224 H 200 V 238" />
    <circle cx="175" cy="224" r="4.5" fill="#38bdf8" stroke="none" />

    <path d="M 185,252 H 205" />
    <circle cx="185" cy="252" r="4.5" fill="#38bdf8" stroke="none" />

    <!-- Right arm circuit trace -->
    <path d="M 325,224 H 300 V 210" />
    <circle cx="325" cy="224" r="4.5" fill="#38bdf8" stroke="none" />

    <path d="M 315,252 H 295" />
    <circle cx="315" cy="252" r="4.5" fill="#38bdf8" stroke="none" />

    <!-- Bottom arm circuit trace -->
    <path d="M 235,315 V 295 H 245" />
    <circle cx="235" cy="315" r="4.5" fill="#38bdf8" stroke="none" />

    <path d="M 265,305 V 285" />
    <circle cx="265" cy="305" r="4.5" fill="#38bdf8" stroke="none" />
  </g>

  <!-- SWOOSH / ORBIT RING -->
  <!-- Outer Swoosh Arc -->
  <path 
    d="M 125,320 
       C 105,350 115,380 155,382 
       C 205,384 270,350 335,295 
       C 400,240 445,175 435,135 
       C 425,100 380,95 340,115 
       C 320,125 315,138 330,138 
       C 355,138 395,148 405,170 
       C 415,195 375,250 315,298 
       C 255,346 195,372 155,365 
       C 135,361 130,345 140,325 Z" 
    fill="url(#orbitGradient)" 
    filter="url(#dropShadow)"
  />

  <!-- FRONT SWOOSH BAR WITH CIRCUIT NODE -->
  <!-- Diagonal Swoosh Beam -->
  <path 
    d="M 130,335 
       C 180,330 220,295 270,250 
       L 370,160 
       C 380,150 395,145 405,150 
       C 415,158 410,172 395,185 
       L 290,278 
       C 240,322 185,355 145,348 
       C 135,346 128,340 130,335 Z" 
    fill="url(#orbitGradient)"
  />

  <!-- CENTRAL NODE ON SWOOSH RING -->
  <circle cx="250" cy="238" r="14" fill="#ffffff" filter="url(#dropShadow)" />
  <circle cx="250" cy="238" r="8" fill="#0284c7" />
  <circle cx="250" cy="238" r="4" fill="#ffffff" />
</svg>
